<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Fruits - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <h2>Send Us a Message</h2>
    <form>
      <label>Name:</label><br>
      <input type="text" placeholder="Your name"
             style="padding: 8px; width: 300px; margin-bottom: 10px;"><br>

      <label>Email:</label><br>
      <input type="email" placeholder="Your email"
             style="padding: 8px; width: 300px; margin-bottom: 10px;"><br>

      <label>Message:</label><br>
      <textarea rows="5" cols="40"
                style="padding: 8px; margin-bottom: 10px;"></textarea><br>

      <button type="submit"
              style="background-color: green; color: white; padding: 10px 20px; border: none; cursor: pointer;">
        Send
      </button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Fresh Fruits. All rights reserved.</p>
  </footer>
</body>
</html>
